name: Telegram Loopback Diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-loopback-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

jobs:
  check:
    if: github.ref == 'refs/heads/diag/telegram-ci-merge-20260909' && github.run_attempt == 1
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify frozen source
        shell: bash
        env:
          EXPECTED_BASE: d50e099b0db11e8ed952101fcf8b9a0383a8a2a0
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          expected_files="$(printf '%s\n' \
            '.github/workflows/ci-check-testbox.yml' \
            'extensions/telegram/src/model-callback.loopback.integration.test.ts')"
          test "$(git diff --name-only HEAD^ HEAD)" = "$expected_files"
          printf 'source=%s base=%s\n' "$(git rev-parse HEAD)" "$EXPECTED_BASE"
          sha256sum extensions/telegram/src/model-callback.loopback.integration.test.ts

      - name: Pin failed CI Node version
        shell: bash
        run: |
          set -euo pipefail
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node 24.19.0

      - name: Restore native dependencies and test caches
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          # Keep the failed CI cache namespace; the preceding step pins its runtime.
          node-version: "24.x"
          cache-mode: restore
          dependency-cache: "true"
          install-bun: "false"
          vitest-fs-cache: "true"
          node-compile-cache: "true"
          node-compile-cache-scope: test

      - name: Record allocation and cache requests
        shell: bash
        env:
          DEPENDENCY_CACHE_KEY: ${{ steps.setup.outputs.dependency-cache-key }}
          DEPENDENCY_CACHE_HIT: ${{ steps.setup.outputs.dependency-cache-hit }}
          VITEST_CACHE_REQUEST_KEY: ${{ steps.setup.outputs.vitest-cache-key }}
          NODE_COMPILE_CACHE_REQUEST_KEY: ${{ steps.setup.outputs.node-compile-cache-key }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const os = require("node:os");
          assert.equal(process.platform, "linux");
          assert.equal(process.versions.node, "24.19.0");
          console.log(JSON.stringify({
            node: process.version,
            arch: process.arch,
            logicalCpuCount: os.availableParallelism(),
            totalMemoryBytes: os.totalmem(),
            failedLogicalCpuCount: 2,
            failedTotalMemoryBytes: 8220487680,
            failedCacheOrigin: "34363409683-1",
            dependencyCacheKey: process.env.DEPENDENCY_CACHE_KEY,
            dependencyCacheHit: process.env.DEPENDENCY_CACHE_HIT,
            vitestCacheRequestKey: process.env.VITEST_CACHE_REQUEST_KEY,
            nodeCompileCacheRequestKey: process.env.NODE_COMPILE_CACHE_REQUEST_KEY,
          }));
          NODE
          # Native restore steps above log the actual matched keys, not just these requests.

      - name: Run original seven-file prefix once
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_NODE_TEST_GROUPS_JSON: >-
            [{"configs":["test/vitest/vitest.extension-telegram.config.ts"],
            "includePatterns":["extensions/telegram/src/miniapp/owner.test.ts",
            "extensions/telegram/src/miniapp/page.auth-timeout.test.ts",
            "extensions/telegram/src/miniapp/page.test.ts",
            "extensions/telegram/src/miniapp/routes.test.ts",
            "extensions/telegram/src/miniapp/url.test.ts",
            "extensions/telegram/src/model-buttons.test.ts",
            "extensions/telegram/src/model-callback.loopback.integration.test.ts"],
            "shard_name":"changed-extensions-config-70"}]
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: "[]"
          OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: "1"
          OPENCLAW_VITEST_MAX_WORKERS: "2"
          OPENCLAW_VITEST_SHARD_NAME: changed-extensions-config-70
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
          OPENCLAW_VITEST_NO_OUTPUT_RETRY: "0"
        run: |
          set -euo pipefail
          time -p node --import tsx scripts/ci-run-node-test-shard.mts
