name: Windows Testbox Probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact diagnostic commit SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  media-phase:
    name: Windows media phase diagnostic
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 60
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_VITEST_MAX_WORKERS: 1
      OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: 1
      OPENCLAW_TEST_PROJECTS_PARALLEL: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify workflow identity
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$TARGET_REF" ]]
          echo "workflow_sha=$WORKFLOW_SHA"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
          submodules: false

      - name: Verify checkout identity
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          [[ "$checkout_sha" == "$TARGET_REF" ]]
          echo "checkout_sha=$checkout_sha"

      - name: Try to exclude workspace from Windows Defender (best-effort)
        shell: pwsh
        run: |
          $cmd = Get-Command Add-MpPreference -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Write-Host "Add-MpPreference not available, skipping Defender exclusions."
            exit 0
          }
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Add-MpPreference -ExclusionProcess "node.exe" -ErrorAction Stop
            Write-Host "Defender exclusions applied."
          } catch {
            Write-Warning "Failed to apply Defender exclusions, continuing."
          }

      - name: Setup Node.js
        env:
          REQUESTED_NODE_VERSION: "24.x"
        run: |
          set -euo pipefail
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node "$REQUESTED_NODE_VERSION"

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          cache-mode: restore
          node-version: 24.x

      - name: Runtime versions
        run: |
          set -euo pipefail
          node -v
          npm -v
          pnpm -v
          node -e 'if (process.platform !== "win32") process.exit(1)'

      - name: Capture node path
        run: |
          set -euo pipefail
          node_bin="$(dirname "$(node -p 'process.execPath')")"
          if command -v cygpath >/dev/null 2>&1; then
            node_bin="$(cygpath -u "$node_bin")"
          fi
          echo "NODE_BIN=$node_bin" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Run one Windows media test
        run: |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          node --import ./scripts/tsx.mjs scripts/test-projects.mts src/agents/tools/media-tool-file-url.windows.test.ts
