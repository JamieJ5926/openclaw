name: Temporary Android catalog native observation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-catalog-native-575c21f7
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'openclaw/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout only the frozen proof input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .proof/android-catalog-native
      - name: Run one bounded native observation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test -z "$(git status --porcelain)"
          test ! -e .env
          cd .proof/android-catalog-native
          sha256sum -c SHA256SUMS
          node launch.mjs run
      - name: Reconcile owned units and finalize evidence
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cd .proof/android-catalog-native
          sha256sum -c SHA256SUMS
          node launch.mjs finish
      - name: Retain complete observations and stop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-catalog-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-catalog-native/export/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
